name: GitHub Pages

# Veröffentlicht die Übersichtsseite und alle Bauteilseiten bei jedem Push auf den
# Standard-Branch: index.html → /<Repo>/, jeder Ordner mit einer index.html
# (z. B. Zylinder-Doppeltwirkend/) → /<Repo>/<Ordner>/.
# Ordner ohne index.html (figur/, docs/) kommen nicht auf die Seite.
# GitHub Pages schaltet der erste Lauf selbst ein (Quelle "GitHub Actions");
# klappt das nicht, sagt der Lauf, was in den Einstellungen zu tun ist.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages einschalten, falls noch nicht geschehen
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Das Token des Workflows hat "Pages: write" und darf die Seite damit
          # selbst anlegen. Schlägt das fehl (zu wenig Rechte, privates Repo
          # ohne passenden Tarif), bleibt der Lauf grün und sagt, was zu tun ist –
          # ein roter Haken wäre hier nur Lärm.
          if gh api -X POST "repos/${{ github.repository }}/pages" \
               -f "build_type=workflow" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages eingeschaltet::Die Seite war noch nicht aktiviert und wurde von diesem Lauf angelegt."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages ist noch nicht aktiviert::Automatisch einschalten hat nicht geklappt. Settings → Pages → Build and deployment → Source: GitHub Actions wählen und diesen Workflow erneut starten."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - name: Seite zusammenstellen
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          # Gemeinsamer Code der Seiten (Design, Bedienelemente, Kontrastregler).
          cp -r shared _site/shared
          rm -f _site/shared/README.md
          rm -rf _site/shared/tests
          for dir in */; do
            page="${dir%/}"
            [ "$page" != _site ] && [ "$page" != shared ] && [ -f "$page/index.html" ] || continue
            # Nicht auf die Seite: Tests, Bauskripte, Doku-Bilder.
            cp -r "$page" "_site/$page"
            rm -rf "_site/$page/tests" "_site/$page/docs" "_site/$page/README.md"
            echo "Veröffentlicht: /$page/"
          done
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
      - name: Veröffentlichen
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
