name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      # Jedes fertige Bauteil bekommt hier seine Geometrieprüfung, z. B.:
      # - name: Geometrie der Figuren prüfen
      #   run: npm run pruef:<bauteil>
