name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      - name: Geometrie der Figuren prüfen
        run: npm run pruef:zylinder
      - name: Geometrie des einfachwirkenden Zylinders prüfen
        run: npm run pruef:zylinder-ew
      - name: Geometrie des Ventils prüfen
        run: npm run pruef:ventil
      - name: Geometrie des 3/2-Ventils prüfen
        run: npm run pruef:ventil32
      - name: Erzeugte Seiten sind aktuell
        # npm test und die Prüfschritte bauen die Seiten neu; ein vergessener
        # Neubau im Commit zeigt sich als Unterschied.
        run: git diff --exit-code -- '*/index.html' index.html
